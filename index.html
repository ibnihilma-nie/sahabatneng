        function SafeSpaceView() {
            const [chatMessages, setChatMessages] = React.useState([
                {

                }
            ]);

            const handleSendChat = (textToSend) => {
                const messageText = textToSend || inputChat;
                if (!messageText.trim()) return;

                const newMessages = [...chatMessages, { sender: 'user', text: messageText }];
                setChatMessages(newMessages);
                if (!textToSend) setInputChat('');

                // Simulated empathetic AI response
                setTimeout(() => {
                    let reply = "Terima kasih sudah mau bercerita. Kamu tidak harus menyelesaikan semuanya sendirian. Aku bisa membantumu menemukan informasi awal atau menghubungkanmu dengan pendamping sebaya yang ramah di Indramayu.";
                    if (messageText.toLowerCase().includes('bingung') || messageText.toLowerCase().includes('cerita')) {
                        reply = "Sangat wajar merasa bingung. Langkah pertamamu menghubungi kami sudah sangat berarti. Mau aku bantu rekomendasikan ruang konsultasi tatap muka tanpa biaya di Indramayu?";
                    }
                    setChatMessages(prev => [...prev, { sender: 'bot', text: reply }]);
                }, 600);
            };

            return (
                <div className="space-y-6 animate-fade-in max-w-3xl mx-auto">

                        <p className="text-xs text-neng-subText max-w-md mx-auto">

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        {[
                            'Saya bingung cerita ke siapa',
                            'Info pendampingan wanita',
                            'Konsultasi minat usaha',
                            'Saya butuh teman diskusi'
                        ].map(topic => (
                            <button
                                key={topic}
                                onClick={() => handleSendChat(topic)}
                                className="p-2.5 rounded-2xl bg-white border border-neng-100 text-[11px] font-bold text-neng-darkText hover:border-neng-300 transition-all text-center shadow-sm"
                            >
                                {topic}
                            </button>
                        ))}
                    </div>

                    {/* Chat Simulation Area */}
                    <div className="bg-white rounded-3xl border border-neng-100 p-5 shadow-sm space-y-4">
                        <div className="h-64 overflow-y-auto space-y-3 p-2">
                            {chatMessages.map((m, idx) => (
                                <div key={idx} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-xs md:max-w-md p-3.5 rounded-2xl text-xs leading-relaxed ${
                                        m.sender === 'user' 
                                            ? 'bg-neng-600 text-white rounded-br-none' 
                                            : 'bg-neng-softBg text-neng-darkText border border-neng-100 rounded-bl-none'
                                    }`}>
                                        {m.text}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Input Box */}
                        <div className="flex gap-2 pt-2 border-t border-neng-100">
                            <input 
                                type="text"
                                placeholder="Ketik pesan atau pertanyaanmu di sini..."
                                value={inputChat}
                                onChange={e => setInputChat(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && handleSendChat()}
                                className="flex-1 px-4 py-2.5 rounded-2xl border border-neng-200 text-xs focus:outline-none focus:ring-2 focus:ring-neng-500"
                            />
                            <button

                            >
                                Kirim

                        <p className="font-bold text-gray-700"><i className="fa-solid fa-shield-halved mr-1"></i> Catatan Privasi & Layanan:</p>
                        <p>
                            Sahabat Neng bukan pengganti layanan medis atau psikis profesional. Untuk situasi khusus yang membutuhkan penanganan darurat, pengguna akan dirujuk secara pribadi kepada lembaga pendamping resmi di Indramayu. Data tersimpan rahasia dan opsional.

            );

            return (
                <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-5 border border-neng-100 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                        <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center hover:bg-gray-200">
                            <i className="fa-solid fa-xmark"></i>
                        </button>

                        <div className="space-y-2">
                            <div className="flex items-center gap-2">
                                <Badge variant="rose">{resource.category}</Badge>
                                <span className="text-xs text-neng-subText"><i className="fa-solid fa-location-dot text-neng-500 mr-1"></i>{resource.district}</span>
                            </div>
                            <h2 className="text-lg font-bold text-neng-darkText">{resource.title}</h2>
                        </div>

                        <div className="space-y-3 text-xs text-neng-darkText">
                            <div className="p-3 rounded-2xl bg-neng-softBg border border-neng-100 space-y-1">
                                <span className="font-bold text-neng-700 block">Deskripsi Kegiatan/Layanan:</span>
                                <p className="text-neng-subText leading-relaxed">{resource.description}</p>
                            </div>

                            <div>
                                <span className="font-bold text-neng-darkText block mb-0.5">Alamat / Lokasi:</span>
                                <p className="text-neng-subText">{resource.address}</p>
                            </div>

                            <div>
                                <span className="font-bold text-neng-darkText block mb-0.5">Persyaratan Pengguna:</span>
                                <p className="text-neng-subText">{resource.prerequisites}</p>
                            </div>

                            <div>
                                <span className="font-bold text-neng-darkText block mb-0.5">Kontak Informasi:</span>
                                <p className="text-neng-600 font-bold">{resource.contact}</p>
                            </div>
                        </div>

                        <div className="pt-3 border-t border-neng-100 flex gap-3">
                            <button
                                onClick={onToggleSave}
                                className={`w-1/2 py-2.5 rounded-xl font-bold text-xs border transition-all ${
                                    isSaved ? 'bg-neng-100 text-neng-700 border-neng-300' : 'bg-white text-neng-700 border-neng-200 hover:bg-neng-50'
                                }`}
                            >
                                <i className={`fa-${isSaved ? 'solid' : 'regular'} fa-bookmark mr-1.5`}></i>
                                {isSaved ? 'Tersimpan' : 'Simpan'}
                            </button>

                            <button
                                onClick={onNavigate}
                                className="w-1/2 py-2.5 rounded-xl bg-neng-600 text-white font-bold text-xs hover:bg-neng-700 transition-all shadow-sm"
                            >
                                Lihat Rekomendasi Jalur
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function MentorDetailModal({ mentor, onClose, showToast }) {
            return (
                <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-5 border border-neng-100 shadow-2xl relative">
                        <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center hover:bg-gray-200">
                            <i className="fa-solid fa-xmark"></i>
                        </button>

                        <div className="flex items-center gap-4">
                            <img src={mentor.avatar} alt={mentor.name} className="w-16 h-16 rounded-2xl object-cover border-2 border-neng-200" />
                            <div>
                                <h2 className="font-bold text-base text-neng-darkText">{mentor.name}</h2>
                                <p className="text-xs text-neng-600 font-semibold">{mentor.role}</p>
                                <Badge variant="peach" className="mt-1">Kecamatan {mentor.district}</Badge>
                            </div>
                        </div>

                        <div className="space-y-3 text-xs text-neng-darkText">
                            <p className="text-neng-subText italic">&ldquo;{mentor.bio}&rdquo;</p>

                            <div className="p-3 rounded-2xl bg-neng-softBg border border-neng-100 space-y-1">
                                <span className="font-bold text-neng-700 block">Jadwal Sesi Pendampingan:</span>
                                <p className="text-neng-darkText">{mentor.availableTime}</p>
                            </div>
                        </div>

                        <button
                            onClick={() => {
                                onClose();
                                showToast(`✨ Pengajuan pendampingan ke ${mentor.name} berhasil terkirim!`);
                            }}
                            className="w-full py-3 rounded-2xl bg-neng-600 text-white font-bold text-xs hover:bg-neng-700 transition-all shadow-soft"
                        >
                            Konfirmasi Ajukan Pendampingan
                        </button>
                    </div>
                </div>
            );
        }

        function CourseDetailModal({ course, onClose, showToast }) {
            return (
                <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-5 border border-neng-100 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                        <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center hover:bg-gray-200">
                            <i className="fa-solid fa-xmark"></i>
                        </button>

                        <div className="space-y-2">
                            <Badge variant="rose">{course.category}</Badge>
                            <h2 className="text-lg font-bold text-neng-darkText">{course.title}</h2>
                            <p className="text-xs text-neng-subText">{course.description}</p>
                        </div>

                        <div className="space-y-2 border-t border-neng-100 pt-3">
                            <h4 className="font-bold text-xs text-neng-darkText">Daftar Modul Pembelajaran:</h4>
                            <div className="space-y-2">
                                {course.lessons.map((les, idx) => (
                                    <div key={idx} className="p-3 rounded-xl bg-neng-softBg border border-neng-100 flex items-center justify-between text-xs">
                                        <div className="flex items-center gap-2">
                                            <span className="w-5 h-5 rounded-full bg-neng-200 text-neng-700 flex items-center justify-center text-[10px] font-bold">
                                                {idx + 1}
                                            </span>
                                            <span className="font-semibold text-neng-darkText">{les}</span>
                                        </div>
                                        <i className="fa-solid fa-circle-play text-neng-500"></i>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <button
                            onClick={() => {
                                onClose();
                                showToast(`🚀 Selamat belajar modul "${course.title}"!`);
                            }}
                            className="w-full py-3 rounded-2xl bg-neng-600 text-white font-bold text-xs hover:bg-neng-700 transition-all shadow-soft"
                        >
                            Mulai Tonton Video Pertama
                        </button>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
